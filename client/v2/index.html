<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEGO Deals Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <h1>🧱 LEGO Deals Dashboard</h1>

    <div class="page-layout">
      <aside class="sidebar">
        <section id="options" class="panel">
          <h2>Options</h2>

          <div id="show" class="control-group">
            <label for="show-select">Show</label>
            <select name="show" id="show-select">
              <option value="6">6</option>
              <option value="12">12</option>
              <option value="24">24</option>
            </select>
          </div>

          <div id="page" class="control-group">
            <label for="page-select">Go to page</label>
            <select name="page" id="page-select"></select>
          </div>

          <div id="filters" class="control-group">
            <label for="filters-select">Filter</label>
            <select name="filters" id="filters-select">
              <option value="">None</option>
              <option value="discount">Best discount (&gt;15%)</option>
              <option value="comments">Most commented (&gt;7)</option>
              <option value="hot">Hot deals (&gt;100°)</option>
            </select>
          </div>

          <div id="sort" class="control-group">
            <label for="sort-select">Sort</label>
            <select name="sort" id="sort-select">
              <option value="">Default</option>
              <option value="price-asc">Cheaper</option>
              <option value="price-desc">Expensive</option>
              <option value="date-asc">Recently published</option>
              <option value="date-desc">Anciently published</option>
              <option value="discount-asc">Best discount</option>
              <option value="discount-desc">Worst discount</option>
            </select>
          </div>
        </section>

        <section id="lego" class="panel">
          <h2>Lego sets</h2>
          <div class="control-group">
            <label for="lego-set-id-select">Lego set id</label>
            <select id="lego-set-id-select"></select>
          </div>
        </section>

        <section id="indicators" class="panel">
          <h2>Indicators</h2>
          <div class="indicators-grid">
            <div class="indicator-card">
              <div class="indicator-label">Number of deals</div>
              <div class="indicator-value" id="nbDeals">0</div>
            </div>

            <div class="indicator-card">
              <div class="indicator-label">Number of sales</div>
              <div class="indicator-value" id="nbSales">0</div>
            </div>

            <div class="indicator-card">
              <div class="indicator-label">p5 sales price</div>
              <div class="indicator-value" id="p5">0</div>
            </div>

            <div class="indicator-card">
              <div class="indicator-label">p25 sales price</div>
              <div class="indicator-value" id="p25">0</div>
            </div>

            <div class="indicator-card">
              <div class="indicator-label">p50 sales price</div>
              <div class="indicator-value" id="p50">0</div>
            </div>

            <div class="indicator-card">
              <div class="indicator-label">Lifetime value</div>
              <div class="indicator-value">10 days</div>
            </div>
          </div>
        </section>
      </aside>

      <main class="content">
        <section id="deals" class="section-box"></section>
      </main>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="portfolio.js"></script>
</body>
</html>
